name: Offline regression tests

on:
  pull_request:
    paths:
      - 'source/**'
      - '.github/workflows/offline-tests.yml'
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/offline-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: source/requirements-desktop.txt
      - name: Install runtime and Qt test dependencies
        run: python -m pip install -r source/requirements-desktop.txt
      - name: Run offline regression suite
        run: python -m unittest discover -s source/tests -v
