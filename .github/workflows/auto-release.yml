name: Build and publish Job Agent

on:
  push:
    branches:
      - main
    paths:
      - release-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-agent-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Read release request
        id: request
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          req = json.loads(Path("release-request.json").read_text())
          print("publish=" + ("true" if req.get("publish") else "false"))
          print("version=" + str(req.get("version", "")).strip())
          print("channel=" + str(req.get("channel", "stable")).strip())
          print("min_version=" + str(req.get("min_version", "")).strip())
          print("source_url=" + str(req.get("base_source_url", "")).strip())
          print("patch_file=" + str(req.get("patch_file", "")).strip())
          PY

      - name: Nothing to publish
        if: steps.request.outputs.publish != 'true'
        run: echo "release-request.json has publish=false; no release will be created."

      - name: Set up Python
        if: steps.request.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate request
        if: steps.request.outputs.publish == 'true'
        shell: bash
        run: |
          test -n "${{ steps.request.outputs.version }}"
          test -n "${{ steps.request.outputs.source_url }}"
          echo "Version: ${{ steps.request.outputs.version }}"
          echo "Source:  ${{ steps.request.outputs.source_url }}"

      - name: Download source bundle
        if: steps.request.outputs.publish == 'true'
        shell: bash
        run: |
          rm -rf source base-source.zip
          mkdir -p source
          curl --fail --location --retry 3             "${{ steps.request.outputs.source_url }}"             --output base-source.zip
          unzip -q base-source.zip -d source

      - name: Apply optional patch
        if: steps.request.outputs.publish == 'true' && steps.request.outputs.patch_file != ''
        shell: bash
        run: |
          cd source
          git apply --unsafe-paths "$GITHUB_WORKSPACE/${{ steps.request.outputs.patch_file }}"

      - name: Set application version
        if: steps.request.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
          CHANNEL: ${{ steps.request.outputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path("source/version.json")
          data = json.loads(p.read_text())
          data["version"] = os.environ["VERSION"]
          data["channel"] = os.environ["CHANNEL"]
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Public-source privacy guard
        if: steps.request.outputs.publish == 'true'
        shell: bash
        run: |
          if find source -type f \( -iname "*.pdf" -o -iname "*.doc" -o -iname "*.docx" \) | grep -q .; then
            echo "Refusing to publish: document/CV file found in public source."
            find source -type f \( -iname "*.pdf" -o -iname "*.doc" -o -iname "*.docx" \)
            exit 1
          fi

      - name: Install build dependencies
        if: steps.request.outputs.publish == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r source/requirements-desktop.txt

      - name: Build ARM64 macOS app
        if: steps.request.outputs.publish == 'true'
        shell: bash
        run: |
          cd source
          rm -rf build dist "Job Agent.spec"

          python -m PyInstaller             --noconfirm             --clean             --windowed             --name "Job Agent"             --osx-bundle-identifier "local.jobagent.desktop"             --hidden-import main             --hidden-import updater             --hidden-import playwright             --hidden-import playwright.async_api             --hidden-import playwright.sync_api             --hidden-import certifi             --collect-data certifi             --copy-metadata playwright             --add-data ".env.example:."             --add-data "version.json:."             desktop.py

          echo "Built executable:"
          file "dist/Job Agent.app/Contents/MacOS/Job Agent"

      - name: Package app and updated source
        if: steps.request.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          mkdir -p release
          APP_ZIP="release/job-agent-${VERSION}-macos.zip"
          SOURCE_ZIP="release/job-agent-source-${VERSION}.zip"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent             "source/dist/Job Agent.app"             "$APP_ZIP"

          (
            cd source
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/$SOURCE_ZIP" .               -x "build/*" "dist/*" "*.spec" "__pycache__/*" "*/__pycache__/*"
          )

          SHA=$(shasum -a 256 "$APP_ZIP" | awk '{print $1}')
          echo "APP_ZIP=$APP_ZIP" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "APP_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Prepare release notes
        if: steps.request.outputs.publish == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(Path("release-request.json").read_text())
          Path("release-notes.md").write_text(
              str(req.get("notes", "Job Agent update")).strip() + "\n"
          )
          PY

      - name: Create or update GitHub Release
        if: steps.request.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APP_ZIP" "$SOURCE_ZIP"               --clobber               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APP_ZIP" "$SOURCE_ZIP"               --repo "$GITHUB_REPOSITORY"               --title "Job Agent Desktop ${VERSION}"               --notes-file release-notes.md
          fi

      - name: Update manifest.json
        if: steps.request.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
          CHANNEL: ${{ steps.request.outputs.channel }}
          MIN_VERSION: ${{ steps.request.outputs.min_version }}
          APP_SHA256: ${{ env.APP_SHA256 }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          req = json.loads(Path("release-request.json").read_text())
          path = Path("manifest.json")
          manifest = json.loads(path.read_text()) if path.exists() else {
              "schema": 1,
              "releases": {}
          }

          version = os.environ["VERSION"]
          channel = os.environ["CHANNEL"] or "stable"
          asset = f"job-agent-{version}-macos.zip"
          url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/download/v{version}/{asset}"
          )

          manifest.setdefault("releases", {})[channel] = {
              "version": version,
              "url": url,
              "sha256": os.environ["APP_SHA256"],
              "notes": str(req.get("notes", "")).strip(),
              "min_version": os.environ["MIN_VERSION"],
          }

          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Commit manifest
        if: steps.request.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          git config user.name "job-agent-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json

          if git diff --cached --quiet; then
            echo "Manifest already current."
          else
            git commit -m "Update stable release manifest to v${VERSION}"
            git push
          fi

      - name: Release summary
        if: steps.request.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          echo "### Job Agent v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: `$APP_ZIP`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: `$SOURCE_ZIP`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: `$APP_SHA256`" >> "$GITHUB_STEP_SUMMARY"
          echo "- manifest.json updated automatically" >> "$GITHUB_STEP_SUMMARY"
