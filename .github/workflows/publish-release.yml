name: Publish Job Agent release

on:
  push:
    branches: [main]
    paths:
      - release-request.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-agent-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      version: ${{ steps.request.outputs.version }}
      channel: ${{ steps.request.outputs.channel }}
      min_version: ${{ steps.request.outputs.min_version }}
      source_url: ${{ steps.request.outputs.source_url }}
      source_sha256: ${{ steps.request.outputs.source_sha256 }}
      notes_b64: ${{ steps.request.outputs.notes_b64 }}
    steps:
      - uses: actions/checkout@v4

      - id: request
        name: Validate release request
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path

          req = json.loads(Path("release-request.json").read_text(encoding="utf-8"))
          publish = bool(req.get("publish", False))
          version = str(req.get("version", "")).strip()
          channel = str(req.get("channel", "stable")).strip()
          min_version = str(req.get("min_version", "")).strip()
          source_url = str(req.get("base_source_url", "")).strip()
          source_sha = str(req.get("base_source_sha256", "")).strip().lower()
          notes = str(req.get("notes", "")).strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid version: {version!r}")
          if channel not in {"stable", "beta"}:
              raise SystemExit(f"Invalid channel: {channel!r}")
          if source_url and not source_url.startswith("https://github.com/xbatm010/job-agent-releases/"):
              raise SystemExit("Bootstrap source URL must be hosted in xbatm010/job-agent-releases")
          if source_url and not re.fullmatch(r"[0-9a-f]{64}", source_sha):
              raise SystemExit("Bootstrap source requires a valid SHA-256")

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"publish={'true' if publish else 'false'}\n")
              fh.write(f"version={version}\n")
              fh.write(f"channel={channel}\n")
              fh.write(f"min_version={min_version}\n")
              fh.write(f"source_url={source_url}\n")
              fh.write(f"source_sha256={source_sha}\n")
              fh.write("notes_b64=" + base64.b64encode(notes.encode()).decode() + "\n")
          PY

  build_publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      MIN_VERSION: ${{ needs.prepare.outputs.min_version }}
      SOURCE_URL: ${{ needs.prepare.outputs.source_url }}
      SOURCE_SHA256: ${{ needs.prepare.outputs.source_sha256 }}
      NOTES_B64: ${{ needs.prepare.outputs.notes_b64 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir -p buildsrc

          if [ -n "$SOURCE_URL" ]; then
            echo "Bootstrapping sanitized source from release asset"
            curl --fail --location --retry 3 "$SOURCE_URL" -o source.zip
            ACTUAL=$(shasum -a 256 source.zip | awk '{print $1}')
            if [ "$ACTUAL" != "$SOURCE_SHA256" ]; then
              echo "Source SHA-256 mismatch"
              echo "Expected: $SOURCE_SHA256"
              echo "Actual:   $ACTUAL"
              exit 1
            fi
            /usr/bin/ditto -x -k source.zip buildsrc
          else
            if [ ! -d source ]; then
              echo "No persistent source/ directory exists."
              exit 1
            fi
            /usr/bin/ditto source buildsrc
          fi

          rm -rf buildsrc/__pycache__ buildsrc/build buildsrc/dist

          test -f buildsrc/desktop.py
          test -f buildsrc/main.py
          test -f buildsrc/updater.py
          test -f buildsrc/requirements-desktop.txt
          test -f buildsrc/version.json
          test -f buildsrc/assets/job_agent_icon.svg

      - name: Privacy guard
        shell: bash
        run: |
          set -euo pipefail
          if find buildsrc -type f \( -iname '*.pdf' -o -iname '*.doc' -o -iname '*.docx' \) | grep -q .; then
            echo "Public source must not contain CV/document files."
            exit 1
          fi

          if grep -R -I -n -E 'madiyar\.batanov|777[[:space:]]*55[[:space:]]*44|CV_Madiyar' buildsrc; then
            echo "Personal-data privacy guard failed."
            exit 1
          fi

      - name: Normalize release version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("buildsrc/version.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"]
          data["channel"] = os.environ["CHANNEL"]
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: buildsrc/requirements-desktop.txt

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r buildsrc/requirements-desktop.txt

      - name: Generate macOS brand assets
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc

          python - <<'PY'
          from pathlib import Path
          from PySide6.QtGui import QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer

          svg = Path("assets/job_agent_icon.svg")
          png = Path("assets/job_agent_icon_1024.png")

          renderer = QSvgRenderer(str(svg))
          if not renderer.isValid():
              raise SystemExit("Invalid Job Agent SVG icon")

          image = QImage(1024, 1024, QImage.Format_ARGB32)
          image.fill(0)
          painter = QPainter(image)
          renderer.render(painter)
          painter.end()

          if not image.save(str(png), "PNG"):
              raise SystemExit("Failed to render Job Agent PNG icon")
          print("Rendered:", png)
          PY

          rm -rf assets/JobAgent.iconset
          mkdir -p assets/JobAgent.iconset
          sips -z 16 16 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/job_agent_icon_1024.png --out assets/JobAgent.iconset/icon_512x512.png >/dev/null
          cp assets/job_agent_icon_1024.png assets/JobAgent.iconset/icon_512x512@2x.png
          iconutil -c icns assets/JobAgent.iconset -o assets/JobAgent.icns
          rm -rf assets/JobAgent.iconset

          test -s assets/job_agent_icon_1024.png
          test -s assets/JobAgent.icns
          echo "Brand assets generated successfully."

      - name: Smoke test dashboard persistence
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile buildsrc/main.py buildsrc/desktop.py buildsrc/updater.py

          python - <<'PY'
          from pathlib import Path
          desktop = Path("buildsrc/desktop.py").read_text(encoding="utf-8")
          assert "def _fit_window_to_screen" in desktop
          assert "dashboard_buttons = [" in desktop
          assert "dash_buttons = QGridLayout()" in desktop
          assert "dash_filters = QGridLayout()" in desktop
          assert "QSvgRenderer" in desktop
          assert "def brand_pixmap" in desktop
          assert "assets/job_agent_icon.svg" in desktop
          assert Path("buildsrc/assets/job_agent_icon_1024.png").stat().st_size > 10000
          assert Path("buildsrc/assets/JobAgent.icns").stat().st_size > 10000
          print("Brand integration smoke test: OK")
          assert "WrapLongRows" in desktop
          assert "Praha + surroundings" in desktop
          assert "Chromium for weak jobs" in desktop
          assert "Czech Průvodní dopis" in desktop
          assert "source_startupjobs" in desktop
          assert "source_indeed" in desktop
          assert "StartupJobs.cz" in desktop
          assert "Indeed.cz" in desktop
          assert "discovery-only" in desktop
          print("Four-source Desktop controls smoke test: OK")
          print("Narrow settings layout smoke test: OK")
          print("Responsive Desktop layout smoke test: OK")
          PY

          STATE_DIR="$RUNNER_TEMP/job-agent-smoke" \
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("buildsrc").resolve()))
          import main

          job = {
              "job_id": "smoke-test",
              "title": "Data Analyst",
              "actual_title": "Data Analyst",
              "company": "Example",
              "url": "https://example.invalid/job",
              "source": "smoke",
              "location": "Praha",
              "role_class": "target",
              "decision": "REVIEW",
              "description": "Smoke test",
              "reasons": ["smoke"],
          }
          main.save_status(job, "REVIEW_PENDING", 65, "smoke")
          assert main.APPLICATIONS_FILE.exists()
          assert main.VACANCIES_FILE.exists()

          safe = dict(job)
          safe.update({
              "source": "jobs.cz",
              "score": 69,
              "decision": "REVIEW",
              "evidence_quality": "strong",
              "hard_experience": False,
          })
          assert main.manual_review_apply_eligible(safe, True)

          weak = dict(safe, evidence_quality="weak")
          assert not main.manual_review_apply_eligible(weak, True)

          blocked_exp = dict(safe, hard_experience=True)
          assert not main.manual_review_apply_eligible(blocked_exp, True)

          assert not main.manual_review_apply_eligible(safe, False)

          low = dict(safe, score=64)
          assert not main.manual_review_apply_eligible(low, True)

          card = main.BeautifulSoup(
              '<article><h2>Data Analyst</h2>'
              '<div class="company">Example Analytics s.r.o.</div></article>',
              "html.parser",
          ).article
          assert main.extract_company_from_search_card(
              card, "Data Analyst"
          ) == "Example Analytics s.r.o."
          print("Company extraction smoke test: OK")

          class _FakeLocator:
              def __init__(self, text="", content="", count=1):
                  self._text = text
                  self._content = content
                  self._count = count

              @property
              def first(self):
                  return self

              async def count(self):
                  return self._count

              async def inner_text(self, *args, **kwargs):
                  return self._text

              async def get_attribute(self, name):
                  return self._content if name == "content" else ""

          class _FakeCompanyPage:
              url = "https://www.jobs.cz/rpd/2001459385/"

              async def evaluate(self, script):
                  return ""

              def locator(self, selector):
                  if selector == "h1":
                      return _FakeLocator(text="Business Intelligence Analyst - PART TIME")
                  if selector == 'meta[property="og:title"]':
                      return _FakeLocator(
                          content=(
                              "Business Intelligence Analyst - PART TIME | "
                              "Example Analytics s.r.o."
                          )
                      )
                  return _FakeLocator(count=0)

              async def title(self):
                  return "Business Intelligence Analyst - PART TIME | Jobs.cz"

          company_name, company_source = main.asyncio.run(
              main.extract_company_from_page(_FakeCompanyPage())
          )
          assert company_name == "Example Analytics s.r.o."
          assert company_source == "browser_meta"
          print("h1_text company extraction regression test: OK")

          assert not main.valid_company("...kde jinde.", "meta")
          assert main.valid_company("Innomotics, s.r.o.", "meta")
          source_text = Path("buildsrc/main.py").read_text(encoding="utf-8")
          assert "v51 will detect the confirmation automatically" not in source_text
          assert "v32 will detect the CV and continue automatically" not in source_text
          assert "Job Agent will detect the confirmation automatically" in source_text
          assert "Job Agent will detect the CV and continue automatically" in source_text
          assert main.upload_action_text("Připojit životopis")
          assert main.upload_action_text("Vložit CV")
          assert '[class*="upload" i]' in source_text
          assert '[class*="resume" i]' in source_text
          assert 'ancestor::*[self::button' in source_text
          print("Metadata + adaptive CV reveal smoke test: OK")

          submitted = dict(job)
          submitted.update({
              "job_id": "jobs.cz:2001320839",
              "url": "https://www.jobs.cz/rpd/2001320839/",
          })
          main.save_status(
              submitted,
              "SUBMITTED_MANUALLY",
              71,
              "duplicate guard smoke",
          )
          assert "job:2001320839" in main.load_processed()
          assert main.canonicalize_saved_history_id(
              "jobs.cz:2001320839"
          ) == "job:2001320839"
          print("Duplicate-application history guard smoke test: OK")

          startup_html = """
          <article>
            <h2><a href="/nabidka/108259/data-analyst-crm-campaigns">Data Analyst (CRM &amp; Campaigns)</a></h2>
            <a href="/startup/example-company">Example Company s.r.o.</a>
            <div>Hybrid Praha Full-time SQL reporting</div>
          </article>
          """
          startup = main.parse_startupjobs_search(startup_html, "Data analytik")
          assert len(startup) == 1
          assert startup[0]["source"] == "startupjobs.cz"
          assert startup[0]["job_id"] == "108259"
          assert startup[0]["company"] == "Example Company s.r.o."
          assert "Praha" in startup[0]["location"]
          assert not main.application_source_supported(startup[0])

          indeed_html = """
          <div class="job_seen_beacon">
            <h2 class="jobTitle">
              <a class="jcs-JobTitle" data-jk="abc123def456" href="/rc/clk?jk=abc123def456">
                <span title="Junior Data Analyst">Junior Data Analyst</span>
              </a>
            </h2>
            <span data-testid="company-name">Example Analytics</span>
            <div data-testid="text-location">Praha</div>
          </div>
          """
          indeed = main.parse_indeed_search(indeed_html, "Junior Data Analyst")
          assert len(indeed) == 1
          assert indeed[0]["source"] == "indeed.cz"
          assert indeed[0]["job_id"] == "abc123def456"
          assert indeed[0]["company"] == "Example Analytics"
          assert indeed[0]["location"] == "Praha"
          assert "viewjob?jk=abc123def456" in indeed[0]["url"]
          assert not main.application_source_supported(indeed[0])

          discovery_review = dict(safe, source="indeed.cz")
          assert not main.manual_review_apply_eligible(discovery_review, True)
          assert "switching to normal Chromium discovery" in Path(
              "buildsrc/main.py"
          ).read_text(encoding="utf-8")
          assert "persistent=True" in Path(
              "buildsrc/main.py"
          ).read_text(encoding="utf-8")
          assert "headless=False" in Path(
              "buildsrc/main.py"
          ).read_text(encoding="utf-8")
          assert startup[0]["title"] == "Data Analyst (CRM & Campaigns)"
          print("Indeed browser fallback regression smoke test: OK")

          glued_title, glued_company = main.split_startupjobs_heading(
              "Future Journey Agency Data Analyst (CRM & Campaigns) "
              "Hybrid Praha Full-time"
          )
          assert glued_title == "Data Analyst (CRM & Campaigns)"
          assert glued_company == "Future Journey Agency"

          duplicate_indeed = [
              dict(indeed[0], job_id="one"),
              dict(indeed[0], job_id="two"),
          ]
          deduped_indeed = main.dedupe_indeed_discovery(duplicate_indeed)
          assert len(deduped_indeed) == 1
          print("Early Indeed semantic dedupe smoke test: OK")

          protected = {
              "source": "indeed.cz",
              "job_id": "protected",
              "title": "Data Analyst Intern - Technology Consulting",
              "actual_title": "Data Analyst Intern - Technology Consulting",
              "company": "PwC",
              "location": "Praha",
              "description": "Original search-card evidence",
              "evidence_quality": "weak",
              "evidence_length": len("Original search-card evidence"),
              "evidence_source": "http",
          }
          main.merge_browser_evidence(
              protected,
              "<html><head><title>Access Denied</title></head>"
              "<body><h1>Access Denied</h1></body></html>",
              "Access Denied",
              current_url="https://cz.indeed.com/viewjob?jk=protected",
          )
          assert protected["actual_title"] == (
              "Data Analyst Intern - Technology Consulting"
          )
          assert protected["company"] == "PwC"
          assert protected["description"] == "Original search-card evidence"
          assert protected["evidence_source"] == "http"
          assert protected["browser_challenge_detected"] is True

          assert main.browser_discovery_block_reason(
              "<html><title>Additional Verification Required</title></html>",
              "Please verify your identity",
              1,
          ) == "CAPTCHA/security challenge"
          assert main.browser_discovery_block_reason(
              "<html><title>Indeed Jobs</title></html>",
              "Data Analyst jobs in Praha",
              main.BROWSER_DISCOVERY_RELOAD_LIMIT,
          ).startswith("reload loop")

          class _FakeBody:
              def __init__(self, page):
                  self.page = page

              @property
              def first(self):
                  return self

              async def count(self):
                  return 1

              async def inner_text(self, *args, **kwargs):
                  return self.page.visible_text()

          class _FakeChallengePage:
              def __init__(self, context=None, replacement=None):
                  self.url = "https://cz.indeed.com/jobs?q=Data+Analyst"
                  self.polls = 0
                  self.closed = False
                  self.context = context
                  self.replacement = replacement

              def is_closed(self):
                  return self.closed

              async def wait_for_timeout(self, ms):
                  self.polls += 1
                  if (
                      self.context is not None
                      and self.replacement is not None
                      and self.polls == 1
                  ):
                      self.closed = True
                      self.context.pages.append(self.replacement)

              async def content(self):
                  if self.closed:
                      raise RuntimeError("Target page has been closed")
                  if self.polls < 2:
                      return (
                          "<html><title>Additional Verification Required</title>"
                          "<body>Please verify you are human</body></html>"
                      )
                  return (
                      "<html><title>Indeed Jobs</title>"
                      "<body>Junior Data Analyst Praha</body></html>"
                  )

              def visible_text(self):
                  if self.polls < 2:
                      return "Please verify you are human"
                  return "Junior Data Analyst Praha"

              def locator(self, selector):
                  assert selector == "body"
                  return _FakeBody(self)

          class _FakeVerifiedPage(_FakeChallengePage):
              def __init__(self):
                  super().__init__()
                  self.polls = 2

          class _FakeContext:
              def __init__(self):
                  self.pages = []

              async def wait_for_event(self, name, timeout=None):
                  raise RuntimeError("no new page")

          old_wait = main.INDEED_MANUAL_CHALLENGE_WAIT_SECONDS
          old_poll = main.INDEED_MANUAL_CHALLENGE_POLL_MS
          main.INDEED_MANUAL_CHALLENGE_WAIT_SECONDS = 2
          main.INDEED_MANUAL_CHALLENGE_POLL_MS = 250
          try:
              context = _FakeContext()
              page = _FakeChallengePage()
              context.pages.append(page)
              verified, verified_html, _, verified_page = main.asyncio.run(
                  main.wait_for_manual_access_challenge(
                      page,
                      context,
                      "Indeed.cz",
                      "Data Analyst",
                      "https://cz.indeed.com/jobs?q=Data+Analyst",
                  )
              )
              assert verified is True
              assert verified_page is page
              assert "Junior Data Analyst" in verified_html

              replacement = _FakeVerifiedPage()
              replacement_context = _FakeContext()
              original = _FakeChallengePage(
                  replacement_context,
                  replacement,
              )
              replacement_context.pages.append(original)
              replaced, replaced_html, _, live_page = main.asyncio.run(
                  main.wait_for_manual_access_challenge(
                      original,
                      replacement_context,
                      "Indeed.cz",
                      "Data Analyst",
                      "https://cz.indeed.com/jobs?q=Data+Analyst",
                  )
              )
          finally:
              main.INDEED_MANUAL_CHALLENGE_WAIT_SECONDS = old_wait
              main.INDEED_MANUAL_CHALLENGE_POLL_MS = old_poll

          assert replaced is True
          assert live_page is replacement
          assert "Junior Data Analyst" in replaced_html
          assert main.browser_page_is_live(replacement)
          assert not main.browser_page_is_live(original)
          print("Indeed manual CAPTCHA + replacement-tab smoke test: OK")

          entry_job = {
              "source": "jobs.cz",
              "job_id": "entry-v273",
              "title": "Data Analytics Internship",
              "actual_title": "Data Analytics Internship",
              "location": "Praha",
              "description": (
                  "SQL PostgreSQL statistical analysis Excel reporting "
                  "data visualization English Prague internship"
              ),
              "card_text": "",
              "evidence_quality": "strong",
          }
          entry_score = main.score_job(entry_job)
          assert entry_score["decision"] == "APPLY"
          assert entry_score["evidence_verified"] is True

          ai_entry_job = {
              "source": "prace.cz",
              "job_id": "ai-entry-v273",
              "title": "AI & Automation Student Support (Part-time)",
              "actual_title": "AI & Automation Student Support (Part-time)",
              "location": "Praha",
              "description": (
                  "Student role focused on SQL, Excel, Power BI, Python, "
                  "data analytics, reporting dashboards and databases in Prague."
              ),
              "card_text": "",
              "evidence_quality": "strong",
          }
          ai_score = main.score_job(ai_entry_job)
          assert main.role_class(ai_entry_job["title"]) == "expanded"
          assert ai_score["expanded_role_eligible"] is True
          assert ai_score["decision"] in {"APPLY", "REVIEW"}
          print("v2.7.3 entry-role scoring smoke test: OK")

          print("Indeed challenge-page protection smoke test: OK")

          print("StartupJobs + Indeed discovery smoke test: OK")

          print("Dashboard persistence + manual queue safety smoke test: OK")
          PY

      - name: Build arm64 macOS app
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --target-arch arm64 \
            --name "Job Agent" \
            --osx-bundle-identifier "local.jobagent.desktop" \
            --icon "assets/JobAgent.icns" \
            --hidden-import main \
            --hidden-import updater \
            --hidden-import playwright \
            --hidden-import playwright.async_api \
            --hidden-import playwright.sync_api \
            --hidden-import certifi \
            --hidden-import PySide6.QtSvg \
            --collect-data certifi \
            --copy-metadata playwright \
            --add-data ".env.example:." \
            --add-data "version.json:." \
            --add-data "assets:assets" \
            desktop.py

          /usr/bin/codesign --force --deep --sign - "dist/Job Agent.app"
          /usr/bin/codesign --verify --deep --strict "dist/Job Agent.app"
          file "dist/Job Agent.app/Contents/MacOS/Job Agent"

      - name: Package and hash
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ZIP="release/job-agent-${VERSION}-macos.zip"
          rm -f "$ZIP"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "buildsrc/dist/Job Agent.app" "$ZIP"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA"

          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          notes = base64.b64decode(os.environ["NOTES_B64"]).decode("utf-8")
          Path("release-notes.txt").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Validate updater extraction
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("buildsrc").resolve()))
          from updater import extract_app

          app = extract_app(Path(os.environ["ZIP"]).resolve())
          print("Extracted update bundle:", app)

          subprocess.run(
              ["/usr/bin/codesign", "--verify", "--deep", "--strict", str(app)],
              check=True,
          )

          symlinks = [p for p in app.rglob("*") if p.is_symlink()]
          print("Preserved symlinks:", len(symlinks))
          if not symlinks:
              raise SystemExit(
                  "Update archive extraction did not preserve any symlinks."
              )
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "$TAG" "$ZIP" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Job Agent Desktop $VERSION" \
              --notes-file release-notes.txt
          fi

      - name: Persist sanitized source and update manifest
        shell: bash
        env:
          RELEASE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail

          rm -rf source
          mkdir -p source

          for f in desktop.py main.py updater.py requirements.txt requirements-desktop.txt .env.example version.json SOURCE_README.md update_manifest.example.json; do
            if [ -f "buildsrc/$f" ]; then
              cp "buildsrc/$f" "source/$f"
            fi
          done

          if [ -d "buildsrc/assets" ]; then
            mkdir -p source/assets
            for f in job_agent_icon.svg job_agent_icon_1024.png JobAgent.icns; do
              if [ -f "buildsrc/assets/$f" ]; then
                cp "buildsrc/assets/$f" "source/assets/$f"
              fi
            done
          fi

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          version = os.environ["VERSION"]
          channel = os.environ["CHANNEL"]
          sha = os.environ["RELEASE_SHA256"]
          notes = __import__("base64").b64decode(os.environ["NOTES_B64"]).decode("utf-8")

          manifest_path = Path("manifest.json")
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          else:
              manifest = {"schema": 1, "releases": {}}

          manifest.setdefault("releases", {})[channel] = {
              "version": version,
              "url": (
                  "https://github.com/xbatm010/job-agent-releases/"
                  f"releases/download/v{version}/job-agent-{version}-macos.zip"
              ),
              "sha256": sha,
              "notes": notes,
              "min_version": os.environ["MIN_VERSION"],
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          req_path = Path("release-request.json")
          req = json.loads(req_path.read_text(encoding="utf-8"))
          req["publish"] = False
          req["last_published"] = version
          req["last_sha256"] = sha
          req["base_source_url"] = ""
          req["base_source_sha256"] = ""
          req_path.write_text(
              json.dumps(req, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json release-request.json source

          if git diff --cached --quiet; then
            echo "No repository metadata changes."
          else
            git commit -m "Publish Job Agent v$VERSION"
            git pull --rebase origin main
            git push
          fi
